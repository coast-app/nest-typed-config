version: 2.1
jobs:
  build:
    docker:
      - image: 'cimg/node:24.22.1'
    steps:
      - checkout
      - run: sudo corepack enable
      - run: pnpm install
      - run: pnpm build
  publish:
    docker:
      - image: 'cimg/node:24.22.1'
    steps:
      - checkout
      - run: sudo corepack enable
      - run: pnpm install
      - run: pnpm build
      - run:
          name: Publish via npm trusted publishing
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            pnpm publish
workflows:
  build_and_publish:
    jobs:
      - build
      - manual_approval:
          type: approval
          requires:
            - build
          filters:
            branches:
              only: main
      - publish:
          context: coast
          requires:
            - manual_approval
          filters:
            branches:
              only: main
